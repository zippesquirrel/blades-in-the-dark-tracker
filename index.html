<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>My Page</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://use.typekit.net/lcc4aaf.css">
    </head>
    <body>
        <h1>BLADES <span style="font-size:70%":>IN THE</span> DARK</h1>
        
        <div id="player-info">
            <label>name</label>
            <input class="text-input" id="strPlayerName-input" onkeydown="store('strPlayerName',this)"><br>
            <label>alias</label>
            <input class="text-input" id="strPlayerAlias-input" onkeydown="store('strPlayerAlias',this)"><br>
            <label>crew</label>
            <input class="text-input" id="strPlayerCrew-input" onkeydown="store('strPlayerCrew',this)"><br>
            <label>look</label>
            <input class="text-input" id="strPlayerLook-input" onkeydown="store('strPlayerLook',this)"><br>
        </div>
        <div id = 'coin-flex'>
            <h2>COIN</h2>
            <div id="coin-tracker">
                <button class="square-button inactive" id="coin-1" onclick="buttonUpdate('intPlayerCoin',coinArray,1)"></button>
                <button class="square-button inactive" id="coin-2" onclick="buttonUpdate('intPlayerCoin',coinArray,2)"></button>
                <button class="square-button inactive" id="coin-3" onclick="buttonUpdate('intPlayerCoin',coinArray,3)"></button>
                <button class="square-button inactive" id="coin-4" onclick="buttonUpdate('intPlayerCoin',coinArray,4)"></button>
            </div>           
        </div>
        <div id = "trauma-stress">
            <div id = 'stress-flex'>
                <h2>STRESS</h2>
                <div id="stress-tracker">
                    <button class="pennant-button inactive" id="stress-1" onclick="buttonUpdate('intPlayerStress',stressArray,1)"></button>
                    <button class="pennant-button inactive" id="stress-2" onclick="buttonUpdate('intPlayerStress',stressArray,2)"></button>
                    <button class="pennant-button inactive" id="stress-3" onclick="buttonUpdate('intPlayerStress',stressArray,3)"></button>
                    <button class="pennant-button inactive" id="stress-4" onclick="buttonUpdate('intPlayerStress',stressArray,4)"></button>
                    <button class="pennant-button inactive" id="stress-5" onclick="buttonUpdate('intPlayerStress',stressArray,5)"></button>
                    <button class="pennant-button inactive" id="stress-6" onclick="buttonUpdate('intPlayerStress',stressArray,6)"></button>
                    <button class="pennant-button inactive" id="stress-7" onclick="buttonUpdate('intPlayerStress',stressArray,7)"></button>
                    <button class="pennant-button inactive" id="stress-8" onclick="buttonUpdate('intPlayerStress',stressArray,8)"></button>
                    <button class="pennant-button inactive" id="stress-9" onclick="buttonUpdate('intPlayerStress',stressArray,9)"></button>
                </div>
            </div>
            <div id = 'trauma-flex'>
                <h2>TRAUMA</h2>
                <div id="trauma-tracker">
                    <button class="pennant-button inactive" id="trauma-1" onclick="buttonUpdate('intPlayerTrauma',traumaArray,1)"></button>
                    <button class="pennant-button inactive" id="trauma-2" onclick="buttonUpdate('intPlayerTrauma',traumaArray,2)"></button>
                    <button class="pennant-button inactive" id="trauma-3" onclick="buttonUpdate('intPlayerTrauma',traumaArray,3)"></button>
                    <button class="pennant-button inactive" id="trauma-4" onclick="buttonUpdate('intPlayerTrauma',traumaArray,4)"></button>
                </div>
            </div>
        </div>

            <button class="healing-button square-button inactive" id="heal-1" onclick="buttonUpdate('intPlayerHeal',healArray,1)"></button>
            <button class="healing-button square-button inactive" id="heal-2" onclick="buttonUpdate('intPlayerHeal',healArray,2)"></button>
            <button class="healing-button square-button inactive" id="heal-3" onclick="buttonUpdate('intPlayerHeal',healArray,3)"></button>
            <button class="healing-button square-button inactive" id="heal-4" onclick="buttonUpdate('intPlayerHeal',healArray,4)"></button>                
        </div> -->
        <script src="main.js"></script>
    </body>

</html>
